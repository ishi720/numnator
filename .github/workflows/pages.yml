name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時に走った場合は最新のデプロイだけを残す
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn

      - id: pages
        uses: actions/configure-pages@v5

      - run: yarn install --frozen-lockfile

      # プロジェクトページ (/numnator/) 配下で動くように base を指定してビルドする
      - run: yarn build --base=${{ steps.pages.outputs.base_path }}/
        env:
          VUE_APP_GOOGLE_ANALYTICS_ID: ${{ vars.GOOGLE_ANALYTICS_ID }}

      # GitHub Pages は history モードのフォールバックが無いため、404.html として index.html を返す
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
